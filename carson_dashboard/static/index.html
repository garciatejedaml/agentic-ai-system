<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carson · agent dashboard</title>
<link rel="stylesheet" href="/dashboard/static/dashboard.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">carson</span>
    <span class="brand-sub">agent observability</span>
  </div>
  <nav class="tabs">
    <a href="#/" data-tab="live">live</a>
    <a href="#/ops" data-tab="ops">ops</a>
    <a href="#/history" data-tab="history">history</a>
  </nav>
  <div class="topright">
    <span class="bell" id="bell">
      <span class="bell-state default" id="perm-pill">checking</span>
      <span class="bell-text">notifications</span>
    </span>
    <span class="conn"><span class="conn-dot"></span><span id="conn-text">connecting</span></span>
  </div>
</header>

<main id="view"></main>

<template id="tpl-live">
  <section class="view view-live">
    <div class="stats">
      <div class="stat"><div class="lbl">tokens / min</div><div class="val" id="stat-tpm">—</div></div>
      <div class="stat"><div class="lbl">avg latency</div><div class="val" id="stat-lat">—</div></div>
      <div class="stat"><div class="lbl">active runs</div><div class="val" id="stat-active">0</div></div>
      <div class="stat"><div class="lbl">errors · 1h</div><div class="val" id="stat-err">0</div></div>
    </div>

    <div class="row">
      <div class="panel panel-graph">
        <div class="phead">
          <span class="ptitle">agent graph · langgraph</span>
          <span class="ptitle"><span class="livedot"></span>live</span>
        </div>
        <svg id="agent-graph" viewBox="0 0 520 360" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <div class="panel panel-log">
        <div class="phead">
          <span class="ptitle">reasoning stream</span>
          <span class="ptitle" id="log-window">last 60s</span>
        </div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <span class="ptitle">timeline · last 60s</span>
        <span class="ptitle">click a run to open detail</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
</template>

<template id="tpl-ops">
  <section class="view view-ops">

    <h3 class="ops-h">jira intake → auto-routing</h3>
    <div class="ops-row ops-row-3">
      <div class="ops-card">
        <div class="ops-card-h"><span>incoming</span><span id="ops-jira-count">—</span></div>
        <div class="jira-list" id="jira-list"></div>
      </div>

      <div class="ops-card ops-router">
        <div class="ops-card-h"><span>router · haiku 4.5</span><span id="ops-router-backend">heuristic</span></div>
        <svg id="ops-router-svg" viewBox="0 0 520 300" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="router-signals">
          <div class="rs-h">classifier signals</div>
          <div id="router-signals" class="rs-list"></div>
        </div>
      </div>

      <div class="ops-card">
        <div class="ops-card-h"><span>active jobs</span><span id="ops-jobs-count">—</span></div>
        <div class="jobs-list" id="jobs-list"></div>
      </div>
    </div>

    <h3 class="ops-h">ops feed · jenkins · spinnaker · pull requests</h3>
    <div class="ops-feed">
      <div class="lane">
        <div class="lane-h"><span class="lane-title"><span class="lane-icon icon-jenkins">J</span> Jenkins</span><span class="lane-count" id="cnt-jenkins">—</span></div>
        <div class="lane-list" id="lane-jenkins"></div>
      </div>
      <div class="lane">
        <div class="lane-h"><span class="lane-title"><span class="lane-icon icon-spinnaker">S</span> Spinnaker</span><span class="lane-count" id="cnt-spinnaker">—</span></div>
        <div class="lane-list" id="lane-spinnaker"></div>
      </div>
      <div class="lane">
        <div class="lane-h"><span class="lane-title"><span class="lane-icon icon-pr">P</span> Pull requests</span><span class="lane-count" id="cnt-github">—</span></div>
        <div class="lane-list" id="lane-github"></div>
      </div>
    </div>

    <h3 class="ops-h">browser notifications · human-in-the-loop</h3>
    <div class="ops-notif">
      <div class="ops-card">
        <div class="perm-row">
          <span>permission</span>
          <span id="perm-state">checking…</span>
        </div>
        <button class="btn-primary" id="btn-enable" type="button">enable browser notifications</button>
        <button class="btn-warn" id="btn-test" type="button">trigger demo HITL alert</button>
        <div class="toast-prev" id="toast-prev">
          <div class="toast-h"><span class="toast-icon">!</span> Carson · HITL approval needed</div>
          <div class="toast-b" id="toast-b">last alert appears here</div>
        </div>
      </div>
      <div class="ops-card">
        <div class="rules-h">notification rules</div>
        <div class="rules-list" id="rules-list"></div>
      </div>
    </div>

  </section>
</template>

<template id="tpl-history">
  <section class="view view-history">
    <div class="bar">
      <div class="pills" id="range-pills">
        <span class="pill" data-hours="1">1h</span>
        <span class="pill" data-hours="24">24h</span>
        <span class="pill on" data-hours="168">7d</span>
        <span class="pill" data-hours="720">30d</span>
      </div>
      <div class="meta" id="range-meta">—</div>
    </div>

    <div class="stats">
      <div class="stat"><div class="lbl">runs</div><div class="val" id="hs-runs">—</div></div>
      <div class="stat"><div class="lbl">avg duration</div><div class="val" id="hs-dur">—</div></div>
      <div class="stat"><div class="lbl">success rate</div><div class="val" id="hs-ok">—</div></div>
      <div class="stat"><div class="lbl">tokens used</div><div class="val" id="hs-tok">—</div></div>
    </div>

    <div class="row">
      <div class="panel">
        <div class="phead">
          <span class="ptitle">agent performance</span>
          <span class="ptitle" id="agents-window">window</span>
        </div>
        <table class="atable">
          <thead>
            <tr><th>agent</th><th class="num">runs</th><th class="num">avg latency</th><th class="num">errors</th></tr>
          </thead>
          <tbody id="agent-table"></tbody>
        </table>
      </div>
      <div class="panel">
        <div class="phead"><span class="ptitle">signals worth investigating</span></div>
        <div class="signals" id="signals"></div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <span class="ptitle">recent runs</span>
        <span class="ptitle">click to open</span>
      </div>
      <div class="runs" id="runs-list"></div>
    </div>
  </section>
</template>

<template id="tpl-run">
  <section class="view view-run">
    <div class="crumb"><a href="#/history">history</a> / runs / <span id="rd-id">—</span></div>

    <div class="hero">
      <div class="herorow">
        <div>
          <div class="rd-runid" id="rd-runid">—</div>
          <div class="rd-input" id="rd-input">—</div>
        </div>
        <span class="rd-status" id="rd-status">—</span>
      </div>
      <div class="badges" id="rd-badges"></div>
    </div>

    <div class="panel">
      <div class="phead">
        <span class="ptitle">timeline · agent swimlanes</span>
        <span class="ptitle">click a block to jump</span>
      </div>
      <div class="swim" id="swim"></div>
    </div>

    <div class="panel">
      <div class="phead">
        <span class="ptitle">reasoning trace</span>
        <span class="ptitle" id="rd-stepcount">—</span>
      </div>
      <div class="rd-steps" id="rd-steps"></div>
    </div>
  </section>
</template>

<script src="/dashboard/static/dashboard.js"></script>
<script src="/dashboard/static/ops.js"></script>
</body>
</html>
