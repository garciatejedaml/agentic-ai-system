<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carson · agent dashboard</title>
<link rel="stylesheet" href="/dashboard/static/dashboard.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">carson</span>
    <span class="brand-sub">agent observability</span>
  </div>
  <nav class="tabs">
    <a href="#/" data-tab="live">live</a>
    <a href="#/autonomous" data-tab="autonomous">autonomous</a>
    <a href="#/chats" data-tab="chats">chats</a>
    <a href="#/pm" data-tab="pm">pm</a>
    <a href="#/ops" data-tab="ops">ops</a>
    <a href="#/cost" data-tab="cost">cost</a>
    <a href="#/replay" data-tab="replay">replay</a>
    <a href="#/autonomy" data-tab="autonomy">autonomy</a>
    <a href="#/audit" data-tab="audit">audit</a>
    <a href="#/history" data-tab="history">history</a>
  </nav>
  <div class="topright">
    <span class="bell" id="bell">
      <span class="bell-state default" id="perm-pill">checking</span>
      <span class="bell-text">notifications</span>
    </span>
    <span class="conn"><span class="conn-dot"></span><span id="conn-text">connecting</span></span>
  </div>
</header>

<main id="view"></main>

<template id="tpl-live">
  <section class="view view-live">
    <div class="stats">
      <div class="stat"><div class="lbl">tokens / min</div><div class="val" id="stat-tpm">—</div></div>
      <div class="stat"><div class="lbl">avg latency</div><div class="val" id="stat-lat">—</div></div>
      <div class="stat"><div class="lbl">active runs</div><div class="val" id="stat-active">0</div></div>
      <div class="stat"><div class="lbl">errors · 1h</div><div class="val" id="stat-err">0</div></div>
    </div>

    <div class="row">
      <div class="panel panel-graph">
        <div class="phead">
          <span class="ptitle">agent graph · langgraph</span>
          <span class="ptitle"><span class="livedot"></span>live</span>
        </div>
        <svg id="agent-graph" viewBox="0 0 540 400" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <div class="panel panel-log">
        <div class="phead">
          <span class="ptitle">reasoning stream</span>
          <span class="ptitle" id="log-window">last 60s</span>
        </div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <span class="ptitle">timeline · last 60s</span>
        <span class="ptitle">click a run to open detail</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>
</template>

<template id="tpl-ops">
  <section class="view view-ops">

    <h3 class="ops-h">jira intake → auto-routing</h3>
    <div class="ops-row ops-row-3">
      <div class="ops-card">
        <div class="ops-card-h"><span>incoming</span><span id="ops-jira-count">—</span></div>
        <div class="jira-list" id="jira-list"></div>
      </div>

      <div class="ops-card ops-router">
        <div class="ops-card-h"><span>router · haiku 4.5</span><span id="ops-router-backend">heuristic</span></div>
        <svg id="ops-router-svg" viewBox="0 0 520 300" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="router-signals">
          <div class="rs-h">classifier signals</div>
          <div id="router-signals" class="rs-list"></div>
        </div>
      </div>

      <div class="ops-card">
        <div class="ops-card-h"><span>active jobs</span><span id="ops-jobs-count">—</span></div>
        <div class="jobs-list" id="jobs-list"></div>
      </div>
    </div>

    <h3 class="ops-h">ops feed · jenkins · spinnaker · pull requests</h3>
    <div class="ops-feed">
      <div class="lane">
        <div class="lane-h"><span class="lane-title"><span class="lane-icon icon-jenkins">J</span> Jenkins</span><span class="lane-count" id="cnt-jenkins">—</span></div>
        <div class="lane-list" id="lane-jenkins"></div>
      </div>
      <div class="lane">
        <div class="lane-h"><span class="lane-title"><span class="lane-icon icon-spinnaker">S</span> Spinnaker</span><span class="lane-count" id="cnt-spinnaker">—</span></div>
        <div class="lane-list" id="lane-spinnaker"></div>
      </div>
      <div class="lane">
        <div class="lane-h"><span class="lane-title"><span class="lane-icon icon-pr">P</span> Pull requests</span><span class="lane-count" id="cnt-github">—</span></div>
        <div class="lane-list" id="lane-github"></div>
      </div>
    </div>

    <h3 class="ops-h">browser notifications · human-in-the-loop</h3>
    <div class="ops-notif">
      <div class="ops-card">
        <div class="perm-row">
          <span>permission</span>
          <span id="perm-state">checking…</span>
        </div>
        <button class="btn-primary" id="btn-enable" type="button">enable browser notifications</button>
        <button class="btn-warn" id="btn-test" type="button">trigger demo HITL alert</button>
        <div class="toast-prev" id="toast-prev">
          <div class="toast-h"><span class="toast-icon">!</span> Carson · HITL approval needed</div>
          <div class="toast-b" id="toast-b">last alert appears here</div>
        </div>
      </div>
      <div class="ops-card">
        <div class="rules-h">notification rules</div>
        <div class="rules-list" id="rules-list"></div>
      </div>
    </div>

  </section>
</template>

<template id="tpl-history">
  <section class="view view-history">
    <div class="bar">
      <div class="pills" id="range-pills">
        <span class="pill" data-hours="1">1h</span>
        <span class="pill" data-hours="24">24h</span>
        <span class="pill on" data-hours="168">7d</span>
        <span class="pill" data-hours="720">30d</span>
      </div>
      <div class="meta" id="range-meta">—</div>
    </div>

    <div class="stats">
      <div class="stat"><div class="lbl">runs</div><div class="val" id="hs-runs">—</div></div>
      <div class="stat"><div class="lbl">avg duration</div><div class="val" id="hs-dur">—</div></div>
      <div class="stat"><div class="lbl">success rate</div><div class="val" id="hs-ok">—</div></div>
      <div class="stat"><div class="lbl">tokens used</div><div class="val" id="hs-tok">—</div></div>
    </div>

    <div class="row">
      <div class="panel">
        <div class="phead">
          <span class="ptitle">agent performance</span>
          <span class="ptitle" id="agents-window">window</span>
        </div>
        <table class="atable">
          <thead>
            <tr><th>agent</th><th class="num">runs</th><th class="num">avg latency</th><th class="num">errors</th></tr>
          </thead>
          <tbody id="agent-table"></tbody>
        </table>
      </div>
      <div class="panel">
        <div class="phead"><span class="ptitle">signals worth investigating</span></div>
        <div class="signals" id="signals"></div>
      </div>
    </div>

    <div class="panel">
      <div class="phead">
        <span class="ptitle">recent runs</span>
        <span class="ptitle">click to open</span>
      </div>
      <div class="runs" id="runs-list"></div>
    </div>
  </section>
</template>

<template id="tpl-run">
  <section class="view view-run">
    <div class="crumb"><a href="#/history">history</a> / runs / <span id="rd-id">—</span></div>

    <div class="hero">
      <div class="herorow">
        <div>
          <div class="rd-runid" id="rd-runid">—</div>
          <div class="rd-input" id="rd-input">—</div>
        </div>
        <span class="rd-status" id="rd-status">—</span>
      </div>
      <div class="badges" id="rd-badges"></div>
    </div>

    <div class="panel">
      <div class="phead">
        <span class="ptitle">timeline · agent swimlanes</span>
        <span class="ptitle">click a block to jump</span>
      </div>
      <div class="swim" id="swim"></div>
    </div>

    <div class="panel">
      <div class="phead">
        <span class="ptitle">reasoning trace</span>
        <span class="ptitle" id="rd-stepcount">—</span>
      </div>
      <div class="rd-steps" id="rd-steps"></div>
    </div>
  </section>
</template>

<template id="tpl-autonomous">
  <section class="view view-autonomous">
    <div class="auto-grid">
      <div class="auto-main">
        <div class="ahead">
          <div class="ahead-l">
            <span class="ahead-title">autonomous coding jobs</span>
            <span class="ahead-meta" id="autonomous-active-count">— active</span>
          </div>
          <div class="ahead-r">
            <span class="status-pill" id="autonomous-summary-pill">
              <span class="dot dot-running"></span><span id="autonomous-summary-text">loading…</span>
            </span>
            <span class="ahead-longest" id="autonomous-longest">longest active: —</span>
          </div>
        </div>
        <div class="auto-jobs" id="auto-jobs"></div>

        <div class="ahead">
          <div class="ahead-l">
            <span class="ahead-title">athena platform · knowledge agents</span>
          </div>
          <div class="ahead-r">
            <span class="ahead-meta" id="autonomous-agents-count">— agents</span>
            <span class="ahead-meta">auto-refresh enabled</span>
          </div>
        </div>
        <div class="auto-agents" id="auto-agents"></div>
      </div>

      <aside class="auto-chat">
        <div class="chat-head">
          <div class="chat-title">
            <span class="chat-dot"></span>
            ask carson
          </div>
          <div class="chat-meta">
            <span class="chat-meta-pill">router · haiku 4.5</span>
          </div>
        </div>
        <div class="chat-sub">
          chat directly with langgraph · the router decides which agent answers
        </div>
        <div class="chat-roster" id="chat-roster"></div>
        <div class="chat-msgs" id="chat-msgs" aria-live="polite"></div>
        <div class="chat-typing" id="chat-typing" hidden>
          <span class="typing-avatar" id="typing-avatar"></span>
          <span class="typing-text"><span id="typing-name">aquiles</span> is thinking</span>
          <span class="typing-dots"><i></i><i></i><i></i></span>
        </div>
        <form class="chat-compose" id="chat-compose">
          <textarea id="chat-input" rows="1" placeholder="ask anything — router classifies and routes" autocomplete="off"></textarea>
          <button type="submit" class="chat-send" aria-label="send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
        <div class="chat-foot">enter sends · shift+enter newline</div>
      </aside>
    </div>
  </section>
</template>

<template id="tpl-cost">
  <section class="view view-cost">
    <div class="ahead">
      <div><span class="ahead-t">carson · cost &amp; impact</span><span class="ahead-m">· last 90 days</span></div>
      <span class="ahead-m" id="c-window">window: q4 → now</span>
    </div>
    <div class="kpis">
      <div class="k">
        <div class="k-l">prs shipped autonomously</div>
        <div class="k-v" id="c-prs">—</div>
        <div class="k-d" id="c-prs-d">—</div>
      </div>
      <div class="k">
        <div class="k-l">eng-hours equivalent saved</div>
        <div class="k-v" id="c-hours">—</div>
        <div class="k-d" id="c-hours-d">—</div>
      </div>
      <div class="k">
        <div class="k-l">prod bugs caught pre-deploy</div>
        <div class="k-v" id="c-bugs">—</div>
        <div class="k-d" id="c-bugs-d">—</div>
      </div>
      <div class="k">
        <div class="k-l">hitl approvals · &lt; 4 min</div>
        <div class="k-v" id="c-hitl">—</div>
        <div class="k-d" id="c-hitl-d">—</div>
      </div>
    </div>

    <div class="cost-row">
      <div class="card">
        <div class="bar-lb"><span>time-to-PR · with vs without</span><span style="color:#5b6072">median, hours</span></div>
        <div class="bar-rail cmp">
          <div class="bar-r2"><span class="lbl">w/ carson</span><div class="rail"><div class="fl with" id="cmp-tt-with-fl"><span id="cmp-tt-with-v">—</span></div></div><span style="font-family:var(--font-mono);font-size:10.5px;color:#74d9a2;width:40px;text-align:right" id="cmp-tt-with-d">—</span></div>
          <div class="bar-r2"><span class="lbl">manual</span><div class="rail"><div class="fl without" style="width:100%"><span id="cmp-tt-without-v">—</span></div></div><span style="font-family:var(--font-mono);font-size:10.5px;color:#8b91a3;width:40px;text-align:right">baseline</span></div>
        </div>
        <div style="margin-top:18px"></div>
        <div class="bar-lb"><span>cost per pr</span><span style="color:#5b6072">tokens + infra, USD</span></div>
        <div class="bar-rail cmp">
          <div class="bar-r2"><span class="lbl">w/ carson</span><div class="rail"><div class="fl with" id="cmp-cp-with-fl"><span id="cmp-cp-with-v">—</span></div></div><span style="font-family:var(--font-mono);font-size:10.5px;color:#74d9a2;width:40px;text-align:right" id="cmp-cp-with-d">—</span></div>
          <div class="bar-r2"><span class="lbl">manual</span><div class="rail"><div class="fl without" style="width:100%"><span id="cmp-cp-without-v">—</span></div></div><span style="font-family:var(--font-mono);font-size:10.5px;color:#8b91a3;width:40px;text-align:right">baseline</span></div>
        </div>
        <div style="margin-top:18px"></div>
        <div class="bar-lb"><span>autonomous % over time</span><span style="color:#5b6072">last 12 weeks</span></div>
        <svg class="spark" id="c-trend-svg" viewBox="0 0 600 60" preserveAspectRatio="none"></svg>
      </div>

      <div class="card">
        <div class="bar-lb" style="margin-bottom:8px"><span>top contributors · this month</span><span style="color:#5b6072">prs merged</span></div>
        <div class="lb" id="c-leaderboard"></div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-replay">
  <section class="view view-replay">
    <div class="rp-h">
      <div class="rp-l">
        <span class="rp-id" id="rp-id">—</span>
        <span class="rp-ti" id="rp-title">—</span>
      </div>
      <div class="rp-r">
        <div class="rp-pl">
          <button class="rp-btn" data-act="first" type="button">⏮</button>
          <button class="rp-btn" data-act="back"  type="button">⏪</button>
          <button class="rp-btn"  data-act="play" type="button">⏵</button>
          <button class="rp-btn" data-act="fwd"   type="button">⏩</button>
          <button class="rp-btn" data-act="last"  type="button">⏭</button>
        </div>
        <span class="rp-sp" id="rp-speed">1.5×</span>
      </div>
    </div>
    <div class="rp-meta" id="rp-meta" style="margin-bottom:10px">—</div>

    <div class="rp-row" style="margin-bottom:10px">
      <div>
        <div class="scrubber" id="rp-scrubber">
          <div class="scr-rail">
            <div class="scr-tk" id="rp-track" style="width:0"></div>
            <div id="rp-events"></div>
            <div class="scr-tm" id="rp-tm">+0s</div>
          </div>
        </div>
        <div class="scr-axis"><span>00:00</span><span id="rp-axis-end">—</span></div>

        <div class="bar-lb" style="margin:14px 0 8px"><span>agent swimlanes · synced to playhead</span><span style="color:#5b6072">vertical line is current frame</span></div>
        <div class="swim-list" id="rp-swims" style="position:relative"></div>

        <div class="tool-pop" id="rp-tool"></div>
      </div>

      <div>
        <div class="bar-lb" style="margin-bottom:8px"><span>recent runs</span><span style="color:#5b6072">click to load</span></div>
        <div class="rp-runs" id="rp-runs"></div>

        <div class="bar-lb" style="margin:14px 0 8px"><span>reasoning stream · time-locked</span><span style="color:#5b6072">±15s window</span></div>
        <div class="frame-stream" id="rp-stream"></div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-autonomy">
  <section class="view view-autonomy">
    <div class="ahead">
      <div><span class="ahead-t">carson · autonomy snapshot</span><span class="ahead-m">· honest read on where carson is good</span></div>
    </div>
    <div class="au-row">
      <div class="card au-c">
        <svg class="au-svg" id="au-gauge-svg" viewBox="0 0 280 180" width="280" height="180"></svg>
        <div class="au-pct" id="au-gauge-pct">—</div>
        <div class="au-d" id="au-gauge-delta">—</div>
        <div class="au-l" id="au-gauge-label">—</div>
      </div>
      <div class="card au-c">
        <svg class="au-svg" id="au-radar-svg" viewBox="0 0 280 220" width="280" height="220"></svg>
        <div class="au-l">strongest at <b style="color:#7c9cff">debug</b> &amp; <b style="color:#7c9cff">refactor</b> · still ramping on <b style="color:#ffb059">infra</b> &amp; <b style="color:#ffb059">ml</b></div>
      </div>
    </div>
    <div class="card">
      <div class="bar-lb" style="margin-bottom:10px"><span>skill detail · last 30 days</span><span style="color:#5b6072">success rate · job count</span></div>
      <div class="skills-rows" id="au-skill-rows"></div>
    </div>
  </section>
</template>

<template id="tpl-audit">
  <section class="view view-audit">
    <div class="ahead">
      <div><span class="ahead-t">compliance · audit trail</span><span class="ahead-m">· every agent action, who approved, what data</span></div>
      <span class="s-tag" style="background:rgba(255,124,124,.10);color:#ff7c7c;border:1px solid rgba(255,124,124,.25);font-size:10px;padding:2px 8px;border-radius:999px;font-family:var(--font-mono)">CISO ready</span>
    </div>

    <div class="au-stats">
      <div class="au-s"><div class="au-s-l">approvals · this period</div><div class="au-s-v" id="au-stat-approvals">—</div></div>
      <div class="au-s"><div class="au-s-l">avg time to approve</div><div class="au-s-v" id="au-stat-time">—</div></div>
      <div class="au-s"><div class="au-s-l">data classifications touched</div><div class="au-s-v" id="au-stat-data">—</div></div>
      <div class="au-s"><div class="au-s-l">pending reviews</div><div class="au-s-v" id="au-stat-pending">—</div></div>
    </div>

    <div class="au-filters" id="au-filters">
      <span class="au-f on" data-type="all">all <span class="cnt" style="color:#5b6072;margin-left:4px">—</span></span>
      <span class="au-f" data-type="deploy">deploys <span class="cnt" style="color:#5b6072;margin-left:4px">—</span></span>
      <span class="au-f" data-type="approval">approvals <span class="cnt" style="color:#5b6072;margin-left:4px">—</span></span>
      <span class="au-f" data-type="data_access">data access <span class="cnt" style="color:#5b6072;margin-left:4px">—</span></span>
      <span class="au-f" data-type="rollback">rollbacks <span class="cnt" style="color:#5b6072;margin-left:4px">—</span></span>
      <span class="au-f" data-type="hitl_approve">hitl approvals <span class="cnt" style="color:#5b6072;margin-left:4px">—</span></span>
      <span class="au-f" data-type="index_sync">index sync <span class="cnt" style="color:#5b6072;margin-left:4px">—</span></span>
      <span class="au-f-sep"></span>
      <span class="au-f" data-since="24">last 24h</span>
      <span class="au-f" data-since="168">last 7d</span>
      <span class="au-f on" data-since="720">last 30d</span>
      <button class="au-exp" id="au-export" type="button">export pdf</button>
      <span id="au-export-tip" style="font-size:10px;color:#5b6072;font-family:var(--font-mono);margin-left:6px"></span>
    </div>

    <div class="card" style="padding:0;overflow-x:auto">
      <table class="au-tbl">
        <thead>
          <tr><th style="padding-left:16px">timestamp</th><th>actor</th><th>event</th><th>resource</th><th>approved by</th><th style="padding-right:16px">trace</th></tr>
        </thead>
        <tbody id="au-tbody"></tbody>
      </table>
    </div>
  </section>
</template>

<template id="tpl-chats">
  <section class="view view-chats">
    <div class="ch-grid">
      <aside class="ch-rail">
        <div class="ch-rail-h">
          <span class="ch-rail-tt">chats</span>
          <span class="ch-rail-cn" id="ch-count">—</span>
        </div>
        <button class="ch-new" id="ch-new" type="button">+ new conversation</button>
        <div class="ch-sessions" id="ch-sessions"></div>
      </aside>

      <section class="ch-active">
        <div class="ch-active-h">
          <div>
            <div class="ch-active-tt" id="ch-active-title">—</div>
            <div class="ch-active-mt" id="ch-active-meta">—</div>
          </div>
          <span class="ch-active-fpill" id="ch-active-focus">—</span>
        </div>
        <div class="chat-msgs" id="ch-active-msgs"></div>
        <form class="chat-compose" id="ch-compose">
          <textarea id="ch-input" rows="1" placeholder="type your message — enter to send" autocomplete="off"></textarea>
          <button type="submit" class="chat-send" aria-label="send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
      </section>
    </div>
  </section>
</template>

<template id="tpl-pm">
  <section class="view view-pm">
    <div class="pm-toolbar">
      <div class="pm-toolbar-l">
        <span class="ahead-t">project manager</span>
        <div class="pm-projects" id="pm-project"></div>
      </div>
      <div class="pm-toolbar-r">
        <button class="auto-btn auto-btn-ghost" type="button">+ new epic</button>
        <button class="auto-btn auto-btn-primary" type="button">draft from chat</button>
      </div>
    </div>

    <div class="pm-grid">
      <aside class="pm-rail">
        <div class="pm-rail-h"><span>epics</span><span style="font-size:10px;color:#5b6072" id="pm-epic-count"></span></div>
        <div class="pm-epics" id="pm-epics"></div>
        <div class="pm-rail-h" style="margin-top:18px"><span>confluence pages</span><span style="font-size:10px;color:#5b6072">recent</span></div>
        <div class="pm-conf" id="pm-conf"></div>
      </aside>

      <section class="pm-board">
        <div class="pm-board-h">
          <span class="pm-board-tt">deliverables · kanban</span>
          <span style="font-size:10.5px;color:#5b6072;font-family:var(--font-mono)">click an epic to focus</span>
        </div>
        <div class="pm-kanban" id="pm-kanban"></div>
      </section>

      <aside class="pm-chat" id="pm-chat">
        <div class="ch-h">
          <div class="ch-t"><span class="ch-d"></span>pm assistant</div>
          <span class="ch-pl">router · pm focus</span>
        </div>
        <div class="ch-s">drafts go through review before commit · no auto-creation</div>
        <div class="chat-msgs" id="pm-chat-msgs"></div>
        <div class="qr">
          <span class="qr-pill" data-text="draft an epic for ">draft an epic</span>
          <span class="qr-pill" data-text="summarise q3 progress">summarise progress</span>
          <span class="qr-pill" data-text="who is blocked?">who is blocked?</span>
          <span class="qr-pill" data-text="draft post-mortem for ">draft post-mortem</span>
          <span class="qr-pill" data-text="create confluence adr for ">create adr</span>
        </div>
        <form class="chat-compose" id="pm-chat-form">
          <textarea id="pm-chat-input" rows="1" placeholder="ask the pm agent — e.g. 'draft an epic for HNSW migration'"></textarea>
          <button type="submit" class="chat-send" aria-label="send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>
      </aside>
    </div>
  </section>
